<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlockable Checklist</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            font-size: 16px;
            color: #6c757d;
            transition: all 0.3s;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }

        .tab:hover {
            color: #667eea;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: bold;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        #taskInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        #taskInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #addBtn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #addBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        #addBtn:active {
            transform: translateY(0);
        }

        .checklist {
            list-style: none;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .checklist-item:hover {
            background: #e9ecef;
        }

        .checklist-item.completed {
            background: #d4edda;
        }

        .checklist-item.completed .item-text {
            text-decoration: line-through;
            color: #6c757d;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .item-text {
            flex: 1;
            font-size: 16px;
            color: #333;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .empty-state {
            text-align: center;
            color: #6c757d;
            padding: 40px 20px;
            font-style: italic;
        }

        .stats {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        .unlock-section {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .unlock-section h3 {
            color: #856404;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .unlock-input-group {
            display: flex;
            gap: 10px;
        }

        #unlockCodeInput {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid #ffc107;
            border-radius: 8px;
            font-size: 14px;
        }

        #unlockCodeInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #unlockBtn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .unlock-status {
            margin-top: 10px;
            font-size: 14px;
            color: #856404;
        }

        .unlocked {
            color: #28a745;
            font-weight: bold;
        }

        .login-form {
            text-align: center;
        }

        .login-form input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .login-form input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-form button {
            width: 100%;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .login-error {
            color: #dc3545;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        .code-display {
            background: #d4edda;
            border: 2px solid #28a745;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            margin-top: 20px;
        }

        .code-display h3 {
            color: #155724;
            margin-bottom: 15px;
        }

        .code-display .code {
            font-size: 32px;
            font-weight: bold;
            color: #155724;
            letter-spacing: 3px;
            font-family: 'Courier New', monospace;
        }

        .code-display .date {
            margin-top: 15px;
            color: #155724;
            font-size: 14px;
        }

        .logout-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✓ Unlockable Checklist</h1>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('checklist')">Checklist</div>
            <div class="tab" onclick="switchTab('code')">Code</div>
        </div>

        <div id="checklistTab" class="tab-content active">
            <div class="unlock-section">
                <h3>🔒 Unlock Full App</h3>
                <div class="unlock-input-group">
                    <input type="text" id="unlockCodeInput" placeholder="Enter daily code..." onkeypress="handleUnlockKeyPress(event)">
                    <button id="unlockBtn" onclick="unlockApp()">Unlock</button>
                </div>
                <div id="unlockStatus" class="unlock-status"></div>
            </div>

            <div class="input-group">
                <input type="text" id="taskInput" placeholder="Add a new task..." onkeypress="handleKeyPress(event)">
                <button id="addBtn" onclick="addTask()">Add</button>
            </div>

            <ul id="checklist" class="checklist">
                <li class="empty-state">No tasks yet. Add one above!</li>
            </ul>

            <div class="stats" id="stats"></div>
        </div>

        <div id="codeTab" class="tab-content">
            <div id="loginForm" class="login-form">
                <h3>🔐 Admin Login</h3>
                <input type="text" id="usernameInput" placeholder="Username" onkeypress="handleLoginKeyPress(event)">
                <input type="password" id="passwordInput" placeholder="Password" onkeypress="handleLoginKeyPress(event)">
                <button onclick="login()">Login</button>
                <p id="loginError" class="login-error">Invalid credentials</p>
            </div>

            <div id="codeDisplay" class="code-display" style="display: none;">
                <h3>Today's Code</h3>
                <div class="code" id="dailyCode"></div>
                <div class="date" id="currentDate"></div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <script>
        const CORRECT_USERNAME = 'bram';
        const CORRECT_PASSWORD = 'secret';
        const PROTECTED_TASK = 'knuffelen met bram';
        let tasks = [];
        let isUnlocked = false;
        let isLoggedIn = false;
        let unlockDate = null;

        // Load unlock state from localStorage
        function loadUnlockState() {
            const storedUnlocked = localStorage.getItem('checklistUnlocked');
            const storedUnlockDate = localStorage.getItem('checklistUnlockDate');
            
            if (storedUnlocked === 'true' && storedUnlockDate) {
                const today = new Date().toISOString().split('T')[0];
                if (storedUnlockDate === today) {
                    isUnlocked = true;
                    unlockDate = storedUnlockDate;
                    const status = document.getElementById('unlockStatus');
                    status.textContent = '✓ App unlocked! You can now create any task.';
                    status.className = 'unlock-status unlocked';
                } else {
                    // Unlock expired, clear localStorage
                    localStorage.removeItem('checklistUnlocked');
                    localStorage.removeItem('checklistUnlockDate');
                }
            }
        }

        // Save unlock state to localStorage
        function saveUnlockState() {
            localStorage.setItem('checklistUnlocked', isUnlocked.toString());
            localStorage.setItem('checklistUnlockDate', unlockDate || '');
        }

        function generateDailyCode() {
            const today = new Date();
            const dateStr = today.toISOString().split('T')[0];
            let hash = 0;
            for (let i = 0; i < dateStr.length; i++) {
                const char = dateStr.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            const code = Math.abs(hash).toString(16).toUpperCase().padStart(6, '0');
            return code.substring(0, 6);
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if (tabName === 'checklist') {
                document.querySelector('.tab:nth-child(1)').classList.add('active');
                document.getElementById('checklistTab').classList.add('active');
            } else {
                document.querySelector('.tab:nth-child(2)').classList.add('active');
                document.getElementById('codeTab').classList.add('active');
            }
        }

        function handleUnlockKeyPress(event) {
            if (event.key === 'Enter') {
                unlockApp();
            }
        }

        function unlockApp() {
            const input = document.getElementById('unlockCodeInput');
            const status = document.getElementById('unlockStatus');
            const correctCode = generateDailyCode();
            
            if (input.value.toUpperCase() === correctCode) {
                isUnlocked = true;
                unlockDate = new Date().toISOString().split('T')[0];
                saveUnlockState();
                status.textContent = '✓ App unlocked! You can now create any task.';
                status.className = 'unlock-status unlocked';
                input.value = '';
                renderChecklist();
            } else {
                status.textContent = '✗ Invalid code. Try again.';
                status.className = 'unlock-status';
            }
        }

        function checkUnlockExpired() {
            if (!isUnlocked || !unlockDate) return false;
            
            const today = new Date().toISOString().split('T')[0];
            if (today !== unlockDate) {
                isUnlocked = false;
                unlockDate = null;
                localStorage.removeItem('checklistUnlocked');
                localStorage.removeItem('checklistUnlockDate');
                const status = document.getElementById('unlockStatus');
                status.textContent = 'Code expired! Enter today\'s code to unlock again.';
                status.className = 'unlock-status';
                return true;
            }
            return false;
        }

        function handleLoginKeyPress(event) {
            if (event.key === 'Enter') {
                login();
            }
        }

        function login() {
            const username = document.getElementById('usernameInput').value;
            const password = document.getElementById('passwordInput').value;
            const error = document.getElementById('loginError');
            
            if (username === CORRECT_USERNAME && password === CORRECT_PASSWORD) {
                isLoggedIn = true;
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('codeDisplay').style.display = 'block';
                document.getElementById('dailyCode').textContent = generateDailyCode();
                document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US', { 
                    weekday: 'long', 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric' 
                });
                error.style.display = 'none';
            } else {
                error.style.display = 'block';
                document.getElementById('usernameInput').value = '';
                document.getElementById('passwordInput').value = '';
            }
        }

        function logout() {
            isLoggedIn = false;
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('codeDisplay').style.display = 'none';
            document.getElementById('usernameInput').value = '';
            document.getElementById('passwordInput').value = '';
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            task.completed = !task.completed;
            renderChecklist();
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            
            if (text === '') return;

            checkUnlockExpired();

            const lowerText = text.toLowerCase();
            if (!isUnlocked && lowerText.includes('bram') && lowerText.includes('knuffelen')) {
                alert('This task is locked! Enter the daily code to unlock the full app.');
                input.value = '';
                return;
            }

            tasks.push({
                id: Date.now(),
                text: text,
                completed: false
            });

            input.value = '';
            renderChecklist();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                addTask();
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            renderChecklist();
        }

        function renderChecklist() {
            const checklist = document.getElementById('checklist');
            const stats = document.getElementById('stats');

            if (tasks.length === 0) {
                checklist.innerHTML = '<li class="empty-state">No tasks yet. Add one above!</li>';
                stats.textContent = '';
                return;
            }

            checklist.innerHTML = tasks.map(task => `
                <li class="checklist-item ${task.completed ? 'completed' : ''}">
                    <input type="checkbox" 
                           ${task.completed ? 'checked' : ''} 
                           onchange="toggleTask(${task.id})">
                    <span class="item-text">${escapeHtml(task.text)}</span>
                    <button class="delete-btn" onclick="deleteTask(${task.id})">Delete</button>
                </li>
            `).join('');

            const completed = tasks.filter(t => t.completed).length;
            stats.textContent = `${completed} of ${tasks.length} tasks completed`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Check every minute if the unlock has expired
        setInterval(() => {
            if (checkUnlockExpired()) {
                renderChecklist();
            }
        }, 60000);

        // Load unlock state on page load
        loadUnlockState();
        renderChecklist();
    </script>
</body>
</html>
